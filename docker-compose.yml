services:
  # Instala deps do monorepo uma vez (evita EEXIST com 3 bun install em paralelo).
  deps:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install --frozen-lockfile"
    restart: "no"

  register:
    image: oven/bun:latest
    command: sh -c "cd apps/register && bunx prisma generate && bun run dev"
    working_dir: /app/apps/register
    container_name: projeto-3-register
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL_REGISTER}
      PORT: 3000
      CORS_ORIGIN: https://clinicasdigitais.cin.ufpe.br
      NODE_ENV: development
    restart: on-failure
    ports:
      - "3010:3000"
    networks:
      - cin_proxy

  auth:
    image: oven/bun:latest
    command: sh -c "cd apps/auth && bunx prisma generate && bun run dev"
    working_dir: /app/apps/auth
    container_name: projeto-3-auth
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      register:
        condition: service_started
    environment:
      - "3011:3001"
    restart: on-failure
    networks:
      - cin_proxy

  historico:
    image: oven/bun:latest
    container_name: projeto-3-historico
    command: sh -c "cd apps/historico && bunx prisma generate && bun run dev"
    working_dir: /app/apps/historico
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NEON_DATABASE_URL_DEV: ${NEON_DATABASE_URL_HISTORICO}
      PORT: 3002
      CORS_ORIGIN: https://clinicasdigitais.cin.ufpe.br
      NODE_ENV: development
    restart: on-failure
    ports:
      - "3012:3002"
    networks:
      - cin_proxy

  frontend:
    build:
      context: ./apps/frontend
    container_name: projeto-3-frontend
    volumes:
      - /opt/docker/frontends/projeto3:/output
    environment:
      NODE_ENV: production
    networks:
      - cin_proxy
    restart: "no"


volumes:
  node_modules:

networks:
  cin_proxy:
    external: true